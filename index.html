<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleição 2026 — Apuração</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6f4;color:#17202a}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0}.status{padding:9px 12px;border-radius:20px;background:#e7f6ed;color:#08783b;font-weight:bold;font-size:12px}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}select,button{padding:12px;border:1px solid #ccd7d1;border-radius:9px;background:#fff}button{background:#08783b;color:#fff;font-weight:bold;cursor:pointer}.card{background:#fff;border:1px solid #dce4df;border-radius:15px;padding:16px;margin-bottom:14px}.big{font-size:58px;font-weight:900}.bar{height:12px;background:#e5eae7;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#08783b;width:0}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#f5f8f6;padding:10px;border-radius:9px;min-width:130px}.stat b{display:block}.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.region{background:#fff;border:1px solid #dce4df;border-radius:13px;padding:13px}.states{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.state{padding:7px 9px;font-size:11px;color:#08783b;background:#f7faf8}.cands{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cand{display:flex;gap:10px;border:1px solid #dce4df;border-radius:11px;padding:9px;align-items:center}.photo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e7ece9}.pct{font-size:19px;font-weight:900;color:#08783b}.muted{color:#68777a;font-size:12px}.err{display:none;background:#fff0f0;color:#a00;padding:10px;border-radius:9px;margin-top:10px}@media(max-width:700px){.regions,.cands{grid-template-columns:1fr}.big{font-size:44px}}</style></head><body><main class="app"><header class="top"><div><h1>🇧🇷 Eleição 2026</h1><div class="muted">Apuração eleitoral</div></div><div id="status" class="status">PRONTO PARA ATUALIZAR</div></header><div class="toolbar"><select id="cargo"><option value="presidente">Presidente</option><option value="governador">Governador</option><option value="senador">Senador</option><option value="depfed">Deputado Federal</option><option value="depest">Deputado Estadual/Distrital</option></select><button id="update">🔄 Atualizar apuração</button></div><section class="card"><div class="muted">APURAÇÃO GERAL — BRASIL</div><div id="progress" class="big">—</div><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><div class="stat"><b id="votes">—</b><span class="muted">votos</span></div><div class="stat"><b id="sections">—</b><span class="muted">seções</span></div><div class="stat"><b id="updated">—</b><span class="muted">atualização</span></div></div><div id="err" class="err"></div></section><section class="card"><h2>Candidatos</h2><div id="cands" class="cands"><div class="muted">Aperte Atualizar apuração.</div></div></section><section id="regions" class="regions"></section><p class="muted" style="text-align:center">Fonte: Tribunal Superior Eleitoral (TSE)</p></main><script>
const TSE='https://resultados.tse.jus.br/oficial/ele2026';
const regions={Norte:['AC','AP','AM','PA','RO','RR','TO'],Nordeste:['AL','BA','CE','MA','PB','PE','PI','RN','SE'],Centro_Oeste:['DF','GO','MT','MS'],Sudeste:['ES','MG','RJ','SP'],Sul:['PR','RS','SC']};
const cargo={presidente:{ele:'6257',cod:'0001'},governador:{ele:'6259',cod:'0003'},senador:{ele:'6259',cod:'0005'},depfed:{ele:'6259',cod:'0006'},depest:{ele:'6259',cod:'0007'}};
const names={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
function n(v){if(typeof v==='number')return v||0;let s=String(v??'').trim();if(!s)return 0;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)||0}
function get(o,ks){for(const k of ks)if(o?.[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null}
function parse(j){const s=j?.s||{},v=j?.v||{};const total=n(get(s,['ts','total','tt','totalSecoes'])),count=n(get(s,['st','sc','secoesTotalizadas','sec']));let p=n(get(s,['pst','p','percentual','pct']));if(!p&&total)p=count/total*100;const valid=n(get(v,['vv','validos','valid']));const arr=Array.isArray(j?.cand)?j.cand:Array.isArray(j?.candidatos)?j.candidatos:[];const candidates=arr.map(c=>({name:get(c,['nm','nmu','nome','name']),number:get(c,['n','num','numero']),party:get(c,['sgp','sg','partido','sigla','part']),votes:n(get(c,['vap','votos','vv','tv','v'])),percent:n(get(c,['pvapn','pvap','percentual','p'])),photo:get(c,['foto','fot','urlFoto','fotoUrl','photo','photoUrl'])})).filter(x=>x.name).sort((a,b)=>b.votes-a.votes);return{total,count,progress:p,valid,candidates}}
async function getJson(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function paths(uf,c){const x=cargo[c],u=uf.toLowerCase(),e=x.ele;return [`${TSE}/${e}/dados/${u}/${u}-c${x.cod}-e0${e}-u.json`,`${TSE}/${e}/dados/${u}/${u}-c${x.cod}-e${e}-u.json`]}
async function ufData(uf,c){for(const p of paths(uf,c)){try{return parse(await getJson(p))}catch(e){}}throw Error('UF sem arquivo disponível')}
function renderRegions(){regionsBox.innerHTML=Object.entries(regions).map(([r,us])=>`<div class="region"><b>${r.replace('_','-')}</b><div class="states">${us.map(u=>`<button class="state" data-uf="${u}">${u}</button>`).join('')}</div><div class="muted" id="r-${r}">—</div></div>`).join('')}
function renderCandidates(cs,uf='Brasil'){cands.innerHTML=cs.length?cs.map(c=>`<article class="cand">${c.photo?`<img class="photo" src="${c.photo}" loading="lazy">`:`<div class="photo"></div>`}<div><b>${c.name}</b><div class="muted">${c.number?'Nº '+c.number+' · ':''}${c.party||'Partido não informado'}</div><div class="pct">${(c.percent||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}%</div><div class="muted">${c.votes.toLocaleString('pt-BR')} votos · ${uf}</div></div></article>`).join(''):'<div class="muted">Nenhum candidato foi retornado pela fonte.</div>'}
function aggregate(ds){const m={};for(const d of ds)for(const c of d.candidates){const k=c.number||c.name;m[k]??={...c,votes:0};m[k].votes+=c.votes}return Object.values(m).sort((a,b)=>b.votes-a.votes)}
async function update(){const c=document.getElementById('cargo').value;updateBtn.disabled=true;status.textContent='ATUALIZANDO…';err.style.display='none';try{const all={};const us=Object.values(regions).flat();for(let i=0;i<us.length;i+=3){const batch=await Promise.all(us.slice(i,i+3).map(async u=>{try{return[u,await ufData(u,c)]}catch(e){return[u,null]}}));batch.forEach(([u,d])=>{if(d)all[u]=d})}const ds=Object.values(all);if(!ds.length)throw Error('O TSE não entregou nenhum arquivo de apuração ao navegador.');const candidates=aggregate(ds);const total=ds.reduce((a,d)=>a+d.total,0),count=ds.reduce((a,d)=>a+d.count,0),valid=ds.reduce((a,d)=>a+d.valid,0);candidates.forEach(x=>x.percent=valid?x.votes/valid*100:0);const p=total?count/total*100:0;progress.textContent=p.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';fill.style.width=Math.min(100,p)+'%';votes.textContent=valid.toLocaleString('pt-BR');sections.textContent=count.toLocaleString('pt-BR')+(total?' / '+total.toLocaleString('pt-BR'):'');updated.textContent=new Date().toLocaleTimeString('pt-BR');renderCandidates(candidates);for(const [r,rs] of Object.entries(regions)){const z=rs.map(u=>all[u]).filter(Boolean);const t=z.reduce((a,d)=>a+d.total,0),q=z.reduce((a,d)=>a+d.count,0);document.getElementById('r-'+r).textContent=t?((q/t)*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'% das seções': 'Sem dados'}status.textContent='ATUALIZADO'}catch(e){progress.textContent='—';fill.style.width='0';status.textContent='ERRO NA ATUALIZAÇÃO';err.textContent='Não foi possível obter dados reais do TSE: '+e.message;err.style.display='block'}finally{updateBtn.disabled=false}}
const updateBtn=document.getElementById('update');const status=document.getElementById('status');const progress=document.getElementById('progress');const fill=document.getElementById('fill');const votes=document.getElementById('votes');const sections=document.getElementById('sections');const updated=document.getElementById('updated');const cands=document.getElementById('cands');const err=document.getElementById('err');const regionsBox=document.getElementById('regions');renderRegions();updateBtn.onclick=update;regionsBox.onclick=async e=>{const u=e.target.dataset.uf;if(!u)return;e.target.disabled=true;try{const d=await ufData(u,document.getElementById('cargo').value);d.candidates.forEach(c=>{if(!c.percent&&d.valid)c.percent=c.votes/d.valid*100});renderCandidates(d.candidates,names[u])}catch(x){err.textContent='Não foi possível carregar '+names[u]+': '+x.message;err.style.display='block'}finally{e.target.disabled=false}};
</script></body></html>
