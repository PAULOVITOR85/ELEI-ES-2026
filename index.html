<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleição 2026 — Apuração</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6f4;color:#17202a}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{padding:9px 12px;border-radius:20px;background:#e7f6ed;color:#08783b;font-weight:bold;font-size:12px}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}select,button{padding:12px;border:1px solid #ccd7d1;border-radius:9px;background:#fff}button{background:#08783b;color:#fff;font-weight:bold;cursor:pointer}.card,.region{background:#fff;border:1px solid #dce4df;border-radius:15px;padding:16px;margin-bottom:14px}.big{font-size:58px;font-weight:900}.bar{height:12px;background:#e5eae7;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#08783b;width:0}.stats,.states{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#f5f8f6;padding:10px;border-radius:9px;min-width:130px}.stat b{display:block}.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.states{margin-top:8px}.state{padding:7px 9px;font-size:11px;color:#08783b;background:#f7faf8}.cands{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.cand{display:flex;gap:10px;border:1px solid #dce4df;border-radius:11px;padding:9px;align-items:center}.photo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e7ece9}.pct{font-size:19px;font-weight:900;color:#08783b}.muted{color:#68777a;font-size:12px}.err{display:none;background:#fff0f0;color:#a00;padding:10px;border-radius:9px;margin-top:10px}@media(max-width:700px){.regions,.cands{grid-template-columns:1fr}.big{font-size:44px}}</style></head><body><main class="app"><header class="top"><div><h1>🇧🇷 Eleição 2026</h1><div class="muted">Apuração eleitoral</div></div><div id="status" class="status">PRONTO PARA ATUALIZAR</div></header><div class="toolbar"><select id="cargo"><option value="presidente">Presidente</option><option value="governador">Governador</option><option value="senador">Senador</option><option value="depfed">Deputado Federal</option><option value="depest">Deputado Estadual/Distrital</option></select><button id="update">🔄 Atualizar apuração</button></div><section class="card"><div class="muted">APURAÇÃO GERAL — BRASIL</div><div id="progress" class="big">—</div><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><div class="stat"><b id="votes">—</b><span class="muted">votos válidos</span></div><div class="stat"><b id="sections">—</b><span class="muted">seções</span></div><div class="stat"><b id="updated">—</b><span class="muted">atualização</span></div></div><div id="err" class="err"></div></section><section class="card"><h2>Candidatos</h2><div id="cands" class="cands"><div class="muted">Aperte Atualizar apuração.</div></div></section><section id="regions" class="regions"></section><p class="muted" style="text-align:center">Fonte: Tribunal Superior Eleitoral (TSE)</p></main><script>const regions={Norte:['AC','AP','AM','PA','RO','RR','TO'],Nordeste:['AL','BA','CE','MA','PB','PE','PI','RN','SE'],Centro_Oeste:['DF','GO','MT','MS'],Sudeste:['ES','MG','RJ','SP'],Sul:['PR','RS','SC']};const names={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};const $=id=>document.getElementById(id);function renderRegions(){regionsBox.innerHTML=Object.entries(regions).map(([r,us])=>`<div class="region"><b>${r.replace('_','-')}</b><div class="states">${us.map(u=>`<button class="state" data-uf="${u}">${u}</button>`).join('')}</div><div class="muted" id="r-${r}">—</div></div>`).join('')}function renderCandidates(cs,label='Brasil'){cands.innerHTML=cs.length?cs.map(c=>`<article class="cand">${c.photo?`<img class="photo" src="${c.photo}" loading="lazy">`:`<div class="photo"></div>`}<div><b>${c.name}</b><div class="muted">${c.number?'Nº '+c.number+' · ':''}${c.party||'Partido não informado'}</div><div class="pct">${Number(c.percent||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}%</div><div class="muted">${Number(c.votes||0).toLocaleString('pt-BR')} votos · ${label}</div></div></article>`).join(''):'<div class="muted">Nenhum candidato retornado pelo TSE.</div>'}async function api(uf=''){const cargoVal=$('cargo').value;const url=`/api/tse?cargo=${encodeURIComponent(cargoVal)}${uf?'&uf='+uf:''}&t=${Date.now()}`;const r=await fetch(url,{cache:'no-store'});const j=await r.json().catch(()=>({error:'Resposta inválida da API'}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}async function update(){const b=$('update');b.disabled=true;$('status').textContent='ATUALIZANDO…';$('err').style.display='none';try{const d=await api();$('progress').textContent=Number(d.progress||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';$('fill').style.width=Math.min(100,Number(d.progress||0))+'%';$('votes').textContent=Number(d.validVotes||0).toLocaleString('pt-BR');$('sections').textContent=Number(d.countedSections||0).toLocaleString('pt-BR')+(d.totalSections?' / '+Number(d.totalSections).toLocaleString('pt-BR'):'');$('updated').textContent=new Date(d.updatedAt||Date.now()).toLocaleTimeString('pt-BR');renderCandidates(d.candidates);for(const [r,us] of Object.entries(regions)){const states=us.map(u=>d.states?.[u]).filter(Boolean);const total=states.reduce((a,x)=>a+Number(x.total||0),0),count=states.reduce((a,x)=>a+Number(x.count||0),0);$('r-'+r).textContent=total?((count/total)*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'% das seções':'Sem dados'}$('status').textContent='ATUALIZADO'}catch(e){$('progress').textContent='—';$('fill').style.width='0';$('status').textContent='ERRO NA ATUALIZAÇÃO';$('err').textContent='Não foi possível obter dados reais: '+e.message;$('err').style.display='block'}finally{b.disabled=false}}$('update').onclick=update;const regionsBox=$('regions');renderRegions();regionsBox.onclick=async e=>{const uf=e.target.dataset.uf;if(!uf)return;e.target.disabled=true;$('err').style.display='none';try{const d=await api(uf);renderCandidates(d.candidates,names[uf])}catch(x){$('err').textContent='Não foi possível carregar '+names[uf]+': '+x.message;$('err').style.display='block'}finally{e.target.disabled=false}};</script></body></html>
